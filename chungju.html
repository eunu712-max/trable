async function open_(pw,save){try{const raw=Uint8Array.from(atob(P),c=>c.charCodeAt(0));const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));
 if(save)try{localStorage.setItem("cj26pw",pw)}catch(e){}
 document.open();document.write(html);document.close();return true}catch(e){return false}}
(async()=>{let s=null;try{s=localStorage.getItem("cj26pw")}catch(e){}if(s&&await open_(s,false))return;
