name: live-flight
on:
  schedule:
    - cron: '*/10 * 5,6,7,8 11 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: live
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/live.py
      - name: commit
        run: |
          git config user.name "trip-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json; git commit -m "실시간 항공 정보" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 10; done
