name: live-flight
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '기간 밖이어도 한 번 확인'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: 확인 (비행일 앞뒤에는 5분마다, 최대 5시간 반복)
        env:
          NTFY_TOPIC: 'trip-d2e93f910059543158e9'
          LOOP_MIN: '310'
          FORCE: ${{ github.event.inputs.force }}
        run: |
          git config user.name "trip-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/live.py
