name: fetch-images
on:
  push:
    paths: ['dl/urls.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p dl/out
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -m 40 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1" -o "dl/out/$name" "$url" || echo "fail $name"
          done < dl/urls.txt
          ls -la dl/out
      - uses: actions/upload-artifact@v4
        with:
          name: imgs
          path: dl/out
          retention-days: 1
