<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b2a4a">
<title>카드뉴스 메이커</title>
<style>
  :root{
    --navy:#1b2a4a; --navy2:#27406b; --ink:#13203a;
    --bg:#f3efe7; --card:#ffffff; --line:#1b2a4a;
    --accent:#e8604c; --accent2:#f2b705; --mut:#7b8191;
    --ok:#1f9d6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",
      "Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    padding-bottom:120px;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--navy); color:#fff;
    padding:14px 16px; display:flex; align-items:center; gap:10px;
    box-shadow:0 2px 0 var(--accent2);
  }
  header h1{font-size:18px; margin:0; font-weight:800; letter-spacing:-.3px; flex:1;}
  header .tag{font-size:11px; background:rgba(255,255,255,.15); padding:3px 8px; border-radius:20px;}
  .wrap{max-width:560px; margin:0 auto; padding:16px;}

  .preview-area{
    background:var(--navy); border-radius:16px; padding:16px; margin-bottom:14px;
    position:relative;
  }
  .canvas-shell{position:relative; width:100%; aspect-ratio:var(--ar,1); }
  canvas#stage{width:100%; height:100%; border-radius:10px; display:block;
    box-shadow:0 10px 30px rgba(0,0,0,.35); background:#fff;}
  .pager{display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top:12px; color:#fff;}
  .pager button{width:40px; height:40px; border-radius:50%; border:none;
    background:rgba(255,255,255,.14); color:#fff; font-size:20px; font-weight:700;}
  .pager button:active{background:rgba(255,255,255,.3);}
  .pager .count{font-size:14px; min-width:70px; text-align:center; font-weight:700;}

  .thumbs{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 8px; margin-bottom:6px;}
  .thumbs .t{flex:0 0 auto; width:54px; height:54px; border-radius:8px;
    border:2px solid transparent; overflow:hidden; position:relative; background:#ddd;}
  .thumbs .t.sel{border-color:var(--accent2);}
  .thumbs .t canvas{width:100%; height:100%; display:block;}
  .thumbs .t .n{position:absolute; top:1px; left:3px; font-size:10px; font-weight:800;
    color:#fff; text-shadow:0 1px 2px #000;}
  .thumbs .add{flex:0 0 auto; width:54px; height:54px; border-radius:8px; border:2px dashed #b9c0cf;
    background:#fff; font-size:24px; color:var(--navy); font-weight:700;}

  .panel{background:var(--card); border:2px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:14px;}
  .panel h2{font-size:13px; margin:0 0 10px; color:var(--navy); font-weight:800;
    display:flex; align-items:center; gap:6px;}
  .panel h2::before{content:""; width:14px; height:3px; background:var(--accent); border-radius:2px;}
  label{display:block; font-size:12px; color:var(--mut); margin:10px 0 4px; font-weight:600;}
  input[type=text], textarea{width:100%; border:1.5px solid #d8dbe3; border-radius:10px;
    padding:10px 12px; font:inherit; font-size:15px; color:var(--ink); background:#fff;}
  textarea{resize:vertical; min-height:70px;}
  input:focus,textarea:focus{outline:none; border-color:var(--navy);}

  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{border:1.5px solid #d8dbe3; background:#fff; border-radius:20px; padding:7px 13px;
    font-size:13px; font-weight:700; color:var(--ink);}
  .chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .sw{width:34px; height:34px; border-radius:8px; border:2px solid #fff;
    box-shadow:0 0 0 1.5px #d8dbe3;}
  .sw.on{box-shadow:0 0 0 2.5px var(--navy);}

  .filebtn{display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--navy);
    color:var(--navy); background:#fff; border-radius:10px; padding:9px 14px; font-weight:700;
    font-size:13px;}
  .filebtn input{display:none;}
  .mini{font-size:11px; color:var(--mut); margin-top:6px;}

  .slider-row{display:flex; align-items:center; gap:10px;}
  .slider-row input[type=range]{flex:1;}

  .actionbar{position:fixed; bottom:0; left:0; right:0; z-index:30; background:#fff;
    border-top:2px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; max-width:560px; margin:0 auto;}
  .btn{flex:1; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:800;}
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:#fff; color:var(--navy); border:2px solid var(--navy); flex:0 0 auto; padding:14px 16px;}
  .btn:active{transform:translateY(1px);}

  .seg{display:flex; border:1.5px solid #d8dbe3; border-radius:10px; overflow:hidden;}
  .seg button{flex:1; border:none; background:#fff; padding:9px; font-size:13px; font-weight:700; color:var(--mut);}
  .seg button.on{background:var(--navy); color:#fff;}

  .danger{color:var(--accent); background:#fff; border:1.5px solid var(--accent);
    border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; width:100%; margin-top:10px;}
  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; font-weight:700; z-index:50;
    opacity:0; transition:opacity .25s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>카드뉴스 메이커</h1>
  <span class="tag">정책홍보용</span>
</header>

<div class="wrap">
  <div class="preview-area">
    <div class="canvas-shell" id="shell">
      <canvas id="stage" width="1080" height="1080"></canvas>
    </div>
    <div class="pager">
      <button id="prev">‹</button>
      <span class="count" id="count">1 / 1</span>
      <button id="next">›</button>
    </div>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <div class="panel">
    <h2>크기 · 테마</h2>
    <label>카드 비율</label>
    <div class="seg" id="ratioSeg">
      <button data-ar="1" class="on">정사각 1:1</button>
      <button data-ar="0.8">세로 4:5</button>
      <button data-ar="0.5625">스토리 9:16</button>
    </div>
    <label>색 테마</label>
    <div class="swatches" id="themes"></div>
  </div>

  <div class="panel">
    <h2>이 카드 내용</h2>
    <label>상단 라벨 (선택)</label>
    <input type="text" id="kicker" placeholder="예: 군포시 알림 · 2026년">
    <label>제목</label>
    <textarea id="title" placeholder="큰 제목을 입력하세요"></textarea>
    <label>본문 (선택)</label>
    <textarea id="body" placeholder="설명 문구를 입력하세요"></textarea>
    <label>하단 꼬리말 (선택)</label>
    <input type="text" id="footer" placeholder="예: 문의 031-390-0000">
  </div>

  <div class="panel">
    <h2>배경 사진</h2>
    <div class="row" style="align-items:center">
      <label class="filebtn">📷 사진 올리기
        <input type="file" id="photo" accept="image/*">
      </label>
      <button class="chip" id="clearPhoto">사진 빼기</button>
    </div>
    <label>사진 어둡게 (글씨 잘 보이게) <span id="dimv" style="color:var(--navy)">45%</span></label>
    <div class="slider-row">
      <input type="range" id="dim" min="0" max="80" value="45">
    </div>
    <label>글자 위치</label>
    <div class="seg" id="alignSeg">
      <button data-al="top">위</button>
      <button data-al="center" class="on">가운데</button>
      <button data-al="bottom">아래</button>
    </div>
    <p class="mini">사진은 이 카드에만 적용돼요. 사진이 없으면 테마 색 배경으로 나옵니다.</p>
  </div>

  <div class="panel">
    <h2>카드 관리</h2>
    <div class="row">
      <button class="chip" id="dupCard">＋ 이 카드 복제</button>
      <button class="chip" id="newCard">＋ 빈 카드 추가</button>
    </div>
    <button class="danger" id="delCard">이 카드 삭제</button>
  </div>
</div>

<div class="actionbar">
  <button class="btn ghost" id="dlOne">이 장</button>
  <button class="btn primary" id="dlAll">전체 저장 (PNG)</button>
</div>

<div class="toast" id="toast"></div>

<script>
const THEMES = [
  {name:'네이비', bg:'#1b2a4a', fg:'#ffffff', ac:'#f2b705'},
  {name:'크림', bg:'#f3efe7', fg:'#1b2a4a', ac:'#e8604c'},
  {name:'코랄', bg:'#e8604c', fg:'#ffffff', ac:'#ffe08a'},
  {name:'민트', bg:'#1f9d6b', fg:'#ffffff', ac:'#fff3b0'},
  {name:'하늘', bg:'#cfe3f3', fg:'#13203a', ac:'#1b2a4a'},
  {name:'먹', bg:'#13203a', fg:'#f3efe7', ac:'#e8604c'},
];

function blankCard(){
  return {kicker:'', title:'', body:'', footer:'', theme:1,
          align:'center', dim:45, img:null, _imgObj:null};
}
let cards = [blankCard()];
let cur = 0;
let ar = 1; // height/width ratio-ish: width fixed 1080, height = 1080/arWidthRatio... use height factor
let arH = 1; // height multiplier relative to 1080 width

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');

function W(){return 1080;}
function H(){return Math.round(1080*arH);}

/* ---------- drawing ---------- */
function roundText(ctx){}
function wrap(ctx, text, maxW){
  const out=[];
  text.split('\n').forEach(para=>{
    if(para===''){out.push(''); return;}
    let line='';
    for(const ch of para){
      const test=line+ch;
      if(ctx.measureText(test).width>maxW && line){out.push(line); line=ch;}
      else line=test;
    }
    out.push(line);
  });
  return out;
}

function draw(c, canvas, forThumb){
  const cx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const th = THEMES[c.theme];
  const pad = Math.round(w*0.085);
  cx.clearRect(0,0,w,h);

  // background
  if(c._imgObj){
    const img=c._imgObj;
    const scale=Math.max(w/img.width, h/img.height);
    const dw=img.width*scale, dh=img.height*scale;
    cx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    cx.fillStyle='rgba(10,15,30,'+(c.dim/100)+')';
    cx.fillRect(0,0,w,h);
  } else {
    cx.fillStyle=th.bg; cx.fillRect(0,0,w,h);
  }

  const textColor = c._imgObj ? '#ffffff' : th.fg;
  const acColor = c._imgObj ? th.ac : th.ac;

  // frame line (navy bold line style)
  cx.strokeStyle = acColor;
  cx.lineWidth = Math.round(w*0.012);
  const m = Math.round(w*0.045);
  cx.strokeRect(m,m,w-2*m,h-2*m);

  // measure block
  const maxW = w-2*pad;
  cx.textBaseline='alphabetic';

  const titleSize = Math.round(w*0.095);
  const kickSize = Math.round(w*0.038);
  const bodySize = Math.round(w*0.045);
  const footSize = Math.round(w*0.033);

  cx.font='800 '+titleSize+'px sans-serif';
  const titleLines = c.title? wrap(cx,c.title,maxW):[];
  cx.font='500 '+bodySize+'px sans-serif';
  const bodyLines = c.body? wrap(cx,c.body,maxW):[];

  const titleLH=titleSize*1.22, bodyLH=bodySize*1.5;
  let blockH=0;
  if(c.kicker) blockH+=kickSize*1.6+10;
  blockH+=titleLines.length*titleLH;
  if(bodyLines.length) blockH+=20+bodyLines.length*bodyLH;

  let y;
  if(c.align==='top') y=pad+kickSize+ (c.kicker?10:0) + titleSize;
  else if(c.align==='bottom') y=h-pad-(c.footer?footSize*2.2:0)-blockH+titleSize;
  else y=(h-blockH)/2+titleSize*0.4+(c.kicker?kickSize*0.6:0);

  // kicker
  if(c.kicker){
    cx.font='800 '+kickSize+'px sans-serif';
    const kw=cx.measureText(c.kicker).width;
    cx.fillStyle=acColor;
    const kpad=Math.round(kickSize*0.5);
    const ky=y-titleSize-kickSize-6;
    cx.fillRect(pad, ky, kw+kpad*2, kickSize*1.5);
    cx.fillStyle = pickContrast(acColor);
    cx.textBaseline='middle';
    cx.fillText(c.kicker, pad+kpad, ky+kickSize*0.78);
    cx.textBaseline='alphabetic';
  }

  // title
  cx.font='800 '+titleSize+'px sans-serif';
  cx.fillStyle=textColor;
  titleLines.forEach((ln,i)=>{ cx.fillText(ln, pad, y+i*titleLH); });
  let yy=y+(titleLines.length? (titleLines.length-1)*titleLH:0);

  // accent underline under title
  if(titleLines.length){
    const lastW=cx.measureText(titleLines[titleLines.length-1]).width;
    cx.strokeStyle=acColor; cx.lineWidth=Math.round(w*0.01); cx.lineCap='round';
    const uy=yy+titleSize*0.28;
    cx.beginPath();
    // wavy underline
    const startX=pad, endX=Math.min(pad+lastW, w-pad);
    const amp=w*0.008, step=w*0.03;
    cx.moveTo(startX,uy);
    for(let x=startX;x<=endX;x+=step){
      cx.quadraticCurveTo(x+step/2, uy+(((x/step)|0)%2?amp:-amp), x+step, uy);
    }
    cx.stroke();
  }

  // body
  if(bodyLines.length){
    cx.font='500 '+bodySize+'px sans-serif';
    cx.fillStyle=textColor;
    let by=yy+titleSize*0.5+40;
    bodyLines.forEach((ln,i)=>{ cx.fillText(ln, pad, by+i*bodyLH); });
  }

  // footer
  if(c.footer){
    cx.font='700 '+footSize+'px sans-serif';
    cx.fillStyle=textColor;
    cx.globalAlpha=0.85;
    cx.fillText(c.footer, pad, h-pad*0.75);
    cx.globalAlpha=1;
  }
}

function pickContrast(hex){
  const c=hex.replace('#','');
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  return (r*299+g*587+b*114)/1000>150?'#13203a':'#ffffff';
}

/* ---------- render current ---------- */
function render(){
  stage.width=W(); stage.height=H();
  document.getElementById('shell').style.setProperty('--ar', (W()/H()));
  draw(cards[cur], stage, false);
  document.getElementById('count').textContent=(cur+1)+' / '+cards.length;
  syncInputs();
  renderThumbs();
}

function renderThumbs(){
  const box=document.getElementById('thumbs');
  box.innerHTML='';
  cards.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='t'+(i===cur?' sel':'');
    const cv=document.createElement('canvas'); cv.width=W(); cv.height=H();
    draw(c,cv,true);
    d.appendChild(cv);
    const n=document.createElement('span'); n.className='n'; n.textContent=i+1; d.appendChild(n);
    d.onclick=()=>{cur=i; render();};
    box.appendChild(d);
  });
  const add=document.createElement('button'); add.className='add'; add.textContent='＋';
  add.onclick=addBlank;
  box.appendChild(add);
}

/* ---------- inputs sync ---------- */
function syncInputs(){
  const c=cards[cur];
  document.getElementById('kicker').value=c.kicker;
  document.getElementById('title').value=c.title;
  document.getElementById('body').value=c.body;
  document.getElementById('footer').value=c.footer;
  document.getElementById('dim').value=c.dim;
  document.getElementById('dimv').textContent=c.dim+'%';
  document.querySelectorAll('#alignSeg button').forEach(b=>b.classList.toggle('on',b.dataset.al===c.align));
  document.querySelectorAll('#themes .sw').forEach((b,i)=>b.classList.toggle('on',i===c.theme));
}

function bindText(id,key){
  document.getElementById(id).addEventListener('input',e=>{
    cards[cur][key]=e.target.value; draw(cards[cur],stage,false); renderThumbs();
  });
}
bindText('kicker','kicker'); bindText('title','title');
bindText('body','body'); bindText('footer','footer');

document.getElementById('dim').addEventListener('input',e=>{
  cards[cur].dim=+e.target.value; document.getElementById('dimv').textContent=e.target.value+'%';
  draw(cards[cur],stage,false);
});

document.querySelectorAll('#alignSeg button').forEach(b=>{
  b.onclick=()=>{cards[cur].align=b.dataset.al; render();};
});

document.querySelectorAll('#ratioSeg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#ratioSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const r=+b.dataset.ar; arH=1/r;
    render();
  };
});

// themes
const themeBox=document.getElementById('themes');
THEMES.forEach((t,i)=>{
  const s=document.createElement('button'); s.className='sw'+(i===1?' on':'');
  s.style.background=t.bg; s.title=t.name;
  s.onclick=()=>{cards[cur].theme=i; render();};
  themeBox.appendChild(s);
});

// photo
document.getElementById('photo').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=ev=>{
    const img=new Image();
    img.onload=()=>{cards[cur].img=ev.target.result; cards[cur]._imgObj=img; render(); toast('사진 적용됨');};
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
});
document.getElementById('clearPhoto').onclick=()=>{
  cards[cur].img=null; cards[cur]._imgObj=null; render(); toast('사진 제거됨');
};

// nav
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;render();}};
document.getElementById('next').onclick=()=>{if(cur<cards.length-1){cur++;render();}};

// card management
function addBlank(){const c=blankCard(); c.theme=cards[cur].theme; cards.push(c); cur=cards.length-1; render(); save();}
document.getElementById('newCard').onclick=addBlank;
document.getElementById('dupCard').onclick=()=>{
  const c=JSON.parse(JSON.stringify(cards[cur])); c._imgObj=cards[cur]._imgObj;
  cards.splice(cur+1,0,c); cur++; render(); save(); toast('복제됨');
};
document.getElementById('delCard').onclick=()=>{
  if(cards.length===1){toast('마지막 카드는 지울 수 없어요'); return;}
  cards.splice(cur,1); if(cur>=cards.length)cur=cards.length-1; render(); save(); toast('삭제됨');
};

/* ---------- download ---------- */
function download(canvas,name){
  const a=document.createElement('a');
  a.download=name; a.href=canvas.toDataURL('image/png'); a.click();
}
document.getElementById('dlOne').onclick=()=>{
  const cv=document.createElement('canvas'); cv.width=W(); cv.height=H();
  draw(cards[cur],cv,false);
  download(cv,'카드뉴스-'+(cur+1)+'.png'); toast('이 카드 저장');
};
document.getElementById('dlAll').onclick=async()=>{
  for(let i=0;i<cards.length;i++){
    const cv=document.createElement('canvas'); cv.width=W(); cv.height=H();
    draw(cards[i],cv,false);
    download(cv,'카드뉴스-'+(i+1)+'.png');
    await new Promise(r=>setTimeout(r,350));
  }
  toast(cards.length+'장 저장 완료');
};

/* ---------- persistence (이 브라우저에만) ---------- */
function save(){
  try{
    const plain=cards.map(c=>({kicker:c.kicker,title:c.title,body:c.body,footer:c.footer,
      theme:c.theme,align:c.align,dim:c.dim,img:c.img}));
    localStorage.setItem('cardnews', JSON.stringify({arH,cards:plain}));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem('cardnews'); if(!raw)return;
    const d=JSON.parse(raw); arH=d.arH||1;
    cards=d.cards.map(c=>{const o=Object.assign(blankCard(),c);
      if(o.img){const im=new Image(); im.onload=()=>{o._imgObj=im; render();}; im.src=o.img;}
      return o;});
    if(!cards.length)cards=[blankCard()];
  }catch(e){}
}
['kicker','title','body','footer'].forEach(id=>document.getElementById(id).addEventListener('input',save));
document.getElementById('dim').addEventListener('change',save);

let toastT;
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600);}

// seed example on first run
load();
if(!cards[0].title && cards.length===1){
  cards[0]=Object.assign(blankCard(),{
    kicker:'군포시 알림', title:'희망도서\n신청하세요', theme:1,
    body:'읽고 싶은 책을 신청하면\n도서관이 구입해 드립니다', footer:'문의 031-390-8875', align:'center'});
}
render();
</script>
</body>
</html>
